name: PHPUnit

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.4', '8.5' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: bcmath, dom, zip

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      # Tests run under ParaTest: PHP 8.4's rewritten ext/dom corrupts the glibc
      # heap during a DOM-heavy run and aborts (SIGABRT) at shutdown, *after* the
      # assertions pass. Splitting the run across worker processes (the runner
      # itself executes no tests) sidesteps the engine bug; 8.5 is unaffected.
      - name: Run tests
        run: vendor/bin/paratest tests
